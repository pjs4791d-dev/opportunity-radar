<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Opportunity Radar</title>
<meta name="description" content="대학·금융권·기술훈련 공고를 매일 모아 동국대 재학생이 참여할 수 있는 것만 보여주는 개인용 레이더" />
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel-2:#eef0f4; --ink:#141824; --ink-2:#4b5262; --mute:#8a91a1; --line:#e2e5ec;
  --accent:#1f5fd6; --accent-ink:#ffffff; --accent-soft:#e6eefc;
  --ok:#1a7f4b; --ok-soft:#e3f5ea; --warn:#a15c00; --warn-soft:#fff3dc; --bad:#c2312d; --bad-soft:#fde9e8;
  --star:#e6a100; --radius:14px; --shadow:0 1px 2px rgba(20,24,36,.05),0 8px 24px rgba(20,24,36,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1117; --panel:#171a23; --panel-2:#1f2330; --ink:#eef0f5; --ink-2:#b8bdc9; --mute:#7f8696; --line:#2a2f3d;
  --accent:#7aa2ff; --accent-ink:#0f1117; --accent-soft:#1c2540;
  --ok:#5fd18f; --ok-soft:#153224; --warn:#f0b357; --warn-soft:#3a2a10; --bad:#ff7b76; --bad-soft:#3d1c1c; --star:#ffc531;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0f1117; --panel:#171a23; --panel-2:#1f2330; --ink:#eef0f5; --ink-2:#b8bdc9; --mute:#7f8696; --line:#2a2f3d;
  --accent:#7aa2ff; --accent-ink:#0f1117; --accent-soft:#1c2540;
  --ok:#5fd18f; --ok-soft:#153224; --warn:#f0b357; --warn-soft:#3a2a10; --bad:#ff7b76; --bad-soft:#3d1c1c; --star:#ffc531;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 80px}

/* ── 상단 고정 ── */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{padding-bottom:0}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0 8px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-size:17px;letter-spacing:-.02em}
.brand span{font-size:11px;color:var(--mute)}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 12px;min-width:0}
.search input{flex:1;border:0;outline:0;background:transparent;padding:9px 0;min-width:0}
.search input::placeholder{color:var(--mute)}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:10px 12px;font-weight:700;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--accent)}
.tab small{font-weight:600;color:var(--mute);margin-left:4px}

/* ── 필터 ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 0 6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip .n{font-weight:700;opacity:.7}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;-webkit-appearance:none;appearance:none;padding-right:24px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 14px) 12px,calc(100% - 10px) 12px;background-size:4px 4px;background-repeat:no-repeat}
.spacer{flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:12px;padding:6px 2px 10px;gap:10px;flex-wrap:wrap}
.meta b{color:var(--ink)}

/* ── 목록 ── */
.grp{margin:18px 0 8px;display:flex;align-items:baseline;gap:8px}
.grp h2{margin:0;font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--mute);font-weight:800}
.grp span{color:var(--mute);font-size:12px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--panel-2)}
.row.open{background:var(--panel-2)}
.dday{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;padding:6px 4px;border-radius:10px;font-weight:800;font-size:13px;background:var(--panel-2);color:var(--ink-2);line-height:1.15}
.dday small{font-size:10px;font-weight:600;opacity:.75}
.dday.urgent{background:var(--bad-soft);color:var(--bad)}
.dday.soon{background:var(--warn-soft);color:var(--warn)}
.dday.none{background:transparent;border:1px dashed var(--line);color:var(--mute)}
.main{min-width:0}
.title{font-weight:700;font-size:15px;line-height:1.35;letter-spacing:-.01em;overflow-wrap:anywhere}
.title .new{display:inline-block;font-size:10px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:6px;margin-right:6px;vertical-align:2px}
.sub{color:var(--mute);font-size:12px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px}
.sub .org{color:var(--ink-2);font-weight:600}
.reason{margin-top:5px;font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.reason .k{flex:none;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;margin-top:1px}
.reason .k.yes{background:var(--ok-soft);color:var(--ok)}
.reason .k.check{background:var(--warn-soft);color:var(--warn)}
.reason .k.dgu{background:var(--accent-soft);color:var(--accent)}
.side{display:flex;gap:2px;align-items:center}
.ib{border:0;background:transparent;width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--mute);font-size:16px;display:grid;place-items:center}
.ib:hover{background:var(--line);color:var(--ink)}
.ib.star.on{color:var(--star)}
.detail{grid-column:1/-1;display:none;padding:2px 0 4px;font-size:13px;color:var(--ink-2)}
.row.open .detail{display:block}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0}
.detail dt{color:var(--mute);font-size:12px}
.detail dd{margin:0}
.detail .go{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 14px;font-weight:800;text-decoration:none;font-size:13px}
.detail .go.sec{background:var(--panel);border:1px solid var(--line);color:var(--ink);margin-left:6px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--warn-soft);color:var(--warn);margin-top:8px}
.tag{display:inline-block;font-size:11px;color:var(--mute)}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
details.check{margin-top:24px}
details.check summary{cursor:pointer;font-weight:800;color:var(--warn);padding:10px 4px;list-style:none;display:flex;align-items:center;gap:8px}
details.check summary::-webkit-details-marker{display:none}
details.check summary::before{content:"▸";transition:.15s}
details.check[open] summary::before{transform:rotate(90deg)}
details.check .list{margin-top:6px}

/* ── 캘린더 ── */
.cal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.mon{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-height:110px}
.mon.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mon h4{margin:0 0 8px;font-size:13px}
.ci{font-size:12px;line-height:1.4;padding:5px 0 5px 9px;border-left:2px solid var(--accent);margin:5px 0}
.ci.dl{border-color:var(--warn)}
.ci a{text-decoration:none;font-weight:700;display:block}
.ci small{color:var(--mute)}
.note{color:var(--mute);font-size:12px;margin:12px 2px}

/* ── 소스/바로가기 ── */
.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.src{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:6px}
.src h4{margin:0;font-size:13px}
.src .st{font-size:11px;font-weight:700}
.src .st.ok{color:var(--ok)} .src .st.err{color:var(--bad)} .src .st.wait{color:var(--warn)} .src .st.link{color:var(--mute)}
.src p{margin:0;font-size:11px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.src a{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;margin-top:auto}
.lgrp{margin-top:18px}
.lgrp h3{font-size:13px;color:var(--mute);margin:0 0 8px}
.lchips{display:flex;flex-wrap:wrap;gap:8px}
.lchips a{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;text-decoration:none}
.lchips a:hover{border-color:var(--accent);color:var(--accent)}
.lchips a.todo{opacity:.45;pointer-events:none}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--mute)}
.stat b{display:block;font-size:20px;color:var(--ink);letter-spacing:-.02em}
.hidden{display:none!important}
footer{margin-top:40px;color:var(--mute);font-size:11px;line-height:1.6}

@media (max-width:640px){
  .wrap{padding:0 12px 80px}
  .brand span{display:none}
  .row{grid-template-columns:52px 1fr;gap:10px;padding:12px}
  .dday{min-width:48px;font-size:12px}
  .side{grid-column:2;justify-content:flex-end;margin-top:-4px}
  .title{font-size:14px}
  .cal{grid-template-columns:1fr 1fr}
  .filters .sel{max-width:46%}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><b>Opportunity Radar</b><span id="sync">불러오는 중…</span></div>
      <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="제목·기관·키워드" /></label>
      <button class="icon" id="theme" title="테마">◐</button>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="all">전체<small id="n-all"></small></button>
      <button class="tab" data-tab="campus">대학·청년<small id="n-campus"></small></button>
      <button class="tab" data-tab="finance">금융권<small id="n-finance"></small></button>
      <button class="tab" data-tab="trades">기술직·국비<small id="n-trades"></small></button>
      <button class="tab" data-tab="saved">★ 보관<small id="n-saved"></small></button>
      <button class="tab" data-tab="links">바로가기</button>
      <button class="tab" data-tab="sources">소스 상태</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="feed">
    <div class="filters" id="filters">
      <button class="chip" data-f="new">신규 3일 <span class="n" id="c-new"></span></button>
      <button class="chip" data-f="week">D-7 이내 <span class="n" id="c-week"></span></button>
      <button class="chip" data-f="dgu">동국대 전용</button>
      <button class="chip" data-f="nocard">카드 불필요</button>
      <button class="chip" data-f="jukjeon">죽전 포함</button>
      <select class="sel" id="cat"><option value="all">모든 분류</option></select>
      <select class="sel" id="grp">
        <option value="all">모든 출처</option>
        <option value="동국대">동국대</option><option value="서연고">서연고</option><option value="서성한">서성한</option>
        <option value="중경외시">중경외시</option><option value="건동홍">건동홍</option><option value="국숭세단">국숭세단</option>
        <option value="__public">공공·기관</option>
      </select>
      <select class="sel" id="sort"><option value="deadline">마감 임박순</option><option value="priority">추천순</option><option value="newest">최근 등록순</option></select>
      <span class="spacer"></span>
      <button class="chip" id="calbtn" style="display:none">📅 연간 캘린더</button>
    </div>
    <div class="meta"><span id="count"></span><span id="hiddenInfo"></span></div>
    <div id="calendar" class="hidden"></div>
    <div id="groups"></div>
    <details class="check" id="check">
      <summary>확인 필요 <span id="checkN"></span> <span class="tag">— 소속 제한 문구가 없어 자동 판정을 못 한 공고</span></summary>
      <div class="list" id="checkList"></div>
    </details>
  </section>

  <section id="links" class="hidden">
    <p class="note">로그인이 필요하거나 약관·robots.txt 상 수집하지 않는 곳. 직접 열어서 확인합니다.</p>
    <div id="linkGroups"></div>
  </section>

  <section id="sources" class="hidden">
    <div class="stats" id="srcStats"></div>
    <div class="filters">
      <button class="chip on" data-st="all">전체</button><button class="chip" data-st="대학">대학</button><button class="chip" data-st="서울시·공공">서울시·공공</button>
      <button class="chip" data-st="창업·테크">창업·테크</button><button class="chip" data-st="금융·증권">금융·증권</button><button class="chip" data-st="직업훈련">직업훈련</button>
      <button class="chip" data-st="__err">실패만</button>
    </div>
    <div class="srcgrid" id="srcGrid"></div>
  </section>

  <footer>
    <div id="foot"></div>
    <div>동국대 재학생 기준으로 참여 가능 여부를 자동 판정합니다. 최종 자격·일정은 반드시 원문에서 확인하세요.</div>
  </footer>
</main>

<script>
const SEC = { campus:'대학·청년', finance:'금융권', trades:'기술직·국비' };
const today = new Date();
const D = { programs:[], sources:[], recurring:[], user:{}, generated_at:null };
const S = { tab:'all', f:new Set(), cat:'all', grp:'all', sort:'deadline', q:'', view:'list', st:'all', open:null };
const store = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
let saved = new Set(store('or-saved', [])), hidden = new Set(store('or-hidden', []));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── 날짜 ──
const pd = v => { if(!v) return null; const d = new Date(v.length === 10 ? v + 'T12:00:00' : v); return isNaN(d) ? null : d; };
const dayDiff = v => { const d = pd(v); if(!d) return null; const a = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()), b = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()); return Math.round((a - b) / 864e5); };
const md = v => { const d = pd(v); return d ? `${d.getMonth()+1}/${d.getDate()}` : '-'; };
const fmtDT = v => { const d = pd(v); if(!d) return '-'; const p = n => String(n).padStart(2,'0'); return `${d.getMonth()+1}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const isNew = p => { const d = dayDiff(p.first_seen); return d !== null && d >= -3; };
const alive = p => { const d = dayDiff(p.deadline); if(d !== null) return d >= 0; const e = dayDiff(p.event_date); return e === null || e >= 0; };

function ddayHTML(p){
  const d = dayDiff(p.deadline);
  if(d === null){ const e = dayDiff(p.event_date); return e !== null ? `<span class="dday none">행사<small>${md(p.event_date)}</small></span>` : `<span class="dday none">마감<small>확인</small></span>`; }
  const cls = d <= 2 ? 'urgent' : d <= 7 ? 'soon' : '';
  return `<span class="dday ${cls}">${d === 0 ? '오늘' : 'D-' + d}<small>${md(p.deadline)}</small></span>`;
}
function cardBadge(p){
  if(!p.requires_card || !D.user.expected_graduation) return '';
  const m = /^(\d{4})-([12])$/.exec(D.user.expected_graduation); if(!m) return '';
  const y = +m[1] - 2, sem = +m[2], avail = new Date(y, sem === 1 ? 2 : 8, 1);
  return today >= avail ? '' : `<span class="badge">내일배움카드 발급 가능 시점: ${y}년 ${sem}학기</span>`;
}
function reasonHTML(p){
  const k = p.eligibility === 'yes' ? (p.dongguk_only ? '<span class="k dgu">동국대 재학생</span>' : '<span class="k yes">참여 가능</span>') : '<span class="k check">확인 필요</span>';
  return `<div class="reason">${k}<span>${esc((p.eligibility_reason || '').slice(0, 90))}</span></div>`;
}
function rowHTML(p){
  const open = S.open === p.id;
  return `<div class="row ${open ? 'open' : ''}" data-id="${p.id}">
    ${ddayHTML(p)}
    <div class="main">
      <div class="title">${isNew(p) ? '<span class="new">NEW</span>' : ''}${esc(p.title)}</div>
      <div class="sub"><span class="org">${esc(p.org)}</span><span>${esc(p.category)}</span>${p.university ? `<span>${esc(p.university)}</span>` : ''}${p.requires_card ? '<span>내일배움카드</span>' : ''}${p.location ? `<span>${esc(p.location)}</span>` : ''}</div>
      ${reasonHTML(p)}
      ${cardBadge(p)}
    </div>
    <div class="side">
      <button class="ib star ${saved.has(p.id) ? 'on' : ''}" data-star="${p.id}" title="보관">${saved.has(p.id) ? '★' : '☆'}</button>
      <button class="ib" data-hide="${p.id}" title="숨기기">×</button>
    </div>
    <div class="detail">
      <dl>
        <dt>신청 마감</dt><dd>${p.deadline ? `${p.deadline.slice(0,10)} (${(d => d === 0 ? '오늘' : 'D-' + d)(dayDiff(p.deadline))})` : '원문에서 확인'}</dd>
        <dt>행사·시작일</dt><dd>${p.event_date ? p.event_date.slice(0,10) : '-'}</dd>
        ${p.format ? `<dt>기간</dt><dd>${esc(p.format)}</dd>` : ''}
        ${p.cost ? `<dt>비용</dt><dd>${esc(p.cost)}</dd>` : ''}
        <dt>판정 근거</dt><dd>${esc(p.eligibility_reason || '-')}</dd>
        <dt>출처</dt><dd>${esc(p.source_id)}${p.posted ? ` · 게시 ${p.posted.slice(0,10)}` : ''} · 발견 ${p.first_seen}${p.also_at && p.also_at.length ? ` · 같은 공고 ${p.also_at.length}곳` : ''}</dd>
      </dl>
      <a class="go" href="${esc(p.url)}" target="_blank" rel="noreferrer">원문 열기 ↗</a>
      ${(p.also_at || []).slice(0,2).map(u => `<a class="go sec" href="${esc(u)}" target="_blank" rel="noreferrer">다른 게시처</a>`).join('')}
    </div>
  </div>`;
}

// ── 필터 ──
function base(){ return D.programs.filter(p => !hidden.has(p.id)); }
function filtered(){
  const q = S.q.trim().toLowerCase();
  let arr = base().filter(p => {
    if(S.tab === 'saved') return saved.has(p.id);
    if(S.tab !== 'all' && p.section !== S.tab) return false;
    if(q){ const t = [p.title, p.org, p.category, p.subcategory, p.university, p.group, ...(p.keywords || [])].join(' ').toLowerCase(); if(!t.includes(q)) return false; }
    if(S.cat !== 'all' && p.category !== S.cat) return false;
    if(S.grp === '__public'){ if(p.university) return false; } else if(S.grp === '동국대'){ if(p.university !== '동국대') return false; } else if(S.grp !== 'all' && p.group !== S.grp) return false;
    if(S.f.has('new') && !isNew(p)) return false;
    if(S.f.has('week')){ const d = dayDiff(p.deadline); if(d === null || d > 7) return false; }
    if(S.f.has('dgu') && !p.dongguk_only) return false;
    if(S.f.has('nocard') && p.requires_card) return false;
    if(!S.f.has('jukjeon') && p.campus === 'jukjeon') return false;
    return true;
  });
  const dd = p => { const d = dayDiff(p.deadline); return d === null ? 9999 : d; };
  if(S.sort === 'deadline') arr.sort((a, b) => dd(a) - dd(b) || b.priority - a.priority);
  else if(S.sort === 'newest') arr.sort((a, b) => (b.first_seen || '').localeCompare(a.first_seen || '') || (b.posted || '').localeCompare(a.posted || ''));
  else arr.sort((a, b) => b.priority - a.priority);
  return arr;
}
function groupOf(p){
  const d = dayDiff(p.deadline);
  if(d === null) return '마감일 확인';
  if(d === 0) return '오늘 마감';
  if(d <= 7) return '이번 주';
  if(d <= 14) return '다음 주';
  return '이후';
}
const GROUP_ORDER = ['오늘 마감', '이번 주', '다음 주', '이후', '마감일 확인'];

// ── 렌더 ──
function renderFeed(){
  const all = filtered();
  const yes = all.filter(p => p.eligibility === 'yes'), chk = all.filter(p => p.eligibility === 'check');
  $('count').innerHTML = `<b>${yes.length}</b>개 표시 · 확인 필요 ${chk.length}개 아래 접힘`;
  $('hiddenInfo').innerHTML = hidden.size ? `숨김 ${hidden.size}개 · <a href="#" id="unhide">모두 되살리기</a>` : '';
  const g = $('groups');
  if(S.view === 'calendar'){ g.innerHTML = ''; $('check').classList.add('hidden'); $('calendar').classList.remove('hidden'); renderCalendar(); return; }
  $('calendar').classList.add('hidden'); $('check').classList.remove('hidden');
  if(!yes.length){ g.innerHTML = `<div class="list"><div class="empty">${S.tab === 'saved' ? '★ 를 눌러 보관한 공고가 여기 모입니다.' : '조건에 맞는 공고가 없습니다.'}</div></div>`; }
  else if(S.sort !== 'deadline'){ g.innerHTML = `<div class="list">${yes.map(rowHTML).join('')}</div>`; }
  else {
    const buckets = {}; yes.forEach(p => (buckets[groupOf(p)] ||= []).push(p));
    g.innerHTML = GROUP_ORDER.filter(k => buckets[k]).map(k => `<div class="grp"><h2>${k}</h2><span>${buckets[k].length}</span></div><div class="list">${buckets[k].map(rowHTML).join('')}</div>`).join('');
  }
  $('checkN').textContent = `${chk.length}개`;
  $('checkList').innerHTML = chk.length ? chk.map(rowHTML).join('') : '<div class="empty">없음</div>';
  $('calbtn').style.display = S.tab === 'finance' ? '' : 'none';
}
function renderCounts(){
  const b = base().filter(p => p.eligibility === 'yes');
  ['campus','finance','trades'].forEach(s => $('n-' + s).textContent = b.filter(p => p.section === s).length);
  $('n-all').textContent = b.length;
  $('n-saved').textContent = saved.size || '';
  $('c-new').textContent = b.filter(isNew).length;
  $('c-week').textContent = b.filter(p => { const d = dayDiff(p.deadline); return d !== null && d <= 7; }).length;
}
function renderCalendar(){
  const months = Array.from({length: 12}, () => []);
  const add = (m, h) => { if(m >= 1 && m <= 12) months[m - 1].push(h); };
  const parse = v => String(v || '').split(/[,\s]+/).flatMap(t => { const r = /^(\d{1,2})-(\d{1,2})$/.exec(t); if(r){ const o = []; for(let m = +r[1]; o.length < 12; m = m % 12 + 1){ o.push(m); if(m === +r[2]) break; } return o; } return t ? [+t] : []; });
  D.recurring.forEach(r => parse(r.months).forEach(m => add(m, `<div class="ci"><a href="${r.url && r.url !== 'TODO' ? esc(r.url) : '#'}" target="_blank" rel="noreferrer">${esc(r.title)}</a><small>${esc(r.org || '')}${r.note ? ' · ' + esc(r.note) : ''}</small></div>`)));
  base().filter(p => p.section === 'finance' && p.eligibility === 'yes' && p.deadline && dayDiff(p.deadline) >= 0).forEach(p => add(pd(p.deadline).getMonth() + 1, `<div class="ci dl"><a href="${esc(p.url)}" target="_blank" rel="noreferrer">${esc(p.title)}</a><small>${esc(p.org)} · 마감 ${md(p.deadline)} (D-${dayDiff(p.deadline)})</small></div>`));
  const now = today.getMonth() + 1;
  $('calendar').innerHTML = `<p class="note">파란선 = 매년 반복(data/recurring.yaml, 공고 전에 준비) · 노란선 = 지금 열려 있는 공고의 마감월</p><div class="cal">${months.map((it, i) => `<div class="mon ${i + 1 === now ? 'now' : ''}"><h4>${i + 1}월</h4>${it.join('') || '<span class="tag">-</span>'}</div>`).join('')}</div>`;
}
function renderLinks(){
  $('linkGroups').innerHTML = Object.entries(SEC).map(([sec, label]) => {
    const arr = D.sources.filter(s => s.method === 'link' && s.section === sec);
    return arr.length ? `<div class="lgrp"><h3>${label}</h3><div class="lchips">${arr.map(s => s.todo ? `<a class="todo" title="주소 미확인">${esc(s.name)}</a>` : `<a href="${esc(s.url)}" target="_blank" rel="noreferrer" title="${esc(s.focus || '')}">${esc(s.name)}</a>`).join('')}</div></div>` : '';
  }).join('');
}
function srcStatus(s){
  if(s.todo) return '<span class="st err">URL 미확인</span>';
  if(s.method === 'link') return '<span class="st link">↗ 바로가기</span>';
  if(s.last_error) return `<span class="st err">✕ 실패 · ${esc(s.last_error.slice(0, 40))}</span>`;
  if(s.last_success) return `<span class="st ok">● ${fmtDT(s.last_success)}</span>`;
  return `<span class="st wait">${s.method === 'api' ? 'API' : '수집'} 대기</span>`;
}
function renderSources(){
  const all = D.sources, col = all.filter(s => s.method !== 'link');
  $('srcStats').innerHTML = [['수집 소스', col.length], ['정상', col.filter(s => s.last_success && !s.last_error).length], ['실패', col.filter(s => s.last_error).length], ['바로가기', all.filter(s => s.method === 'link').length]].map(([l, v]) => `<div class="stat">${l}<b>${v}</b></div>`).join('');
  const arr = all.filter(s => S.st === 'all' ? true : S.st === '__err' ? !!s.last_error : s.type === S.st);
  $('srcGrid').innerHTML = arr.map(s => `<div class="src"><div style="display:flex;justify-content:space-between;gap:8px"><span class="tag">${esc(s.group)}</span>${srcStatus(s)}</div><h4>${esc(s.name)}</h4><p>${esc(s.focus || '')}</p>${s.todo ? '<span class="tag">게시판 주소를 아직 찾지 못했습니다</span>' : `<a href="${esc(s.url)}" target="_blank" rel="noreferrer">열기 ↗</a>`}</div>`).join('');
}
function showTab(t){
  S.tab = t; S.open = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  const feed = !['links', 'sources'].includes(t);
  $('feed').classList.toggle('hidden', !feed); $('links').classList.toggle('hidden', t !== 'links'); $('sources').classList.toggle('hidden', t !== 'sources');
  if(t !== 'finance' && S.view === 'calendar') S.view = 'list';
  if(feed) renderFeed(); else if(t === 'links') renderLinks(); else renderSources();
  window.scrollTo({top: 0});
}

// ── 이벤트 ──
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if(t){ showTab(t.dataset.tab); return; }
  const f = e.target.closest('[data-f]'); if(f){ const k = f.dataset.f; S.f.has(k) ? S.f.delete(k) : S.f.add(k); f.classList.toggle('on', S.f.has(k)); renderFeed(); return; }
  const st = e.target.closest('[data-st]'); if(st){ S.st = st.dataset.st; document.querySelectorAll('[data-st]').forEach(x => x.classList.toggle('on', x === st)); renderSources(); return; }
  const star = e.target.closest('[data-star]'); if(star){ const id = star.dataset.star; saved.has(id) ? saved.delete(id) : saved.add(id); save('or-saved', [...saved]); renderCounts(); renderFeed(); return; }
  const h = e.target.closest('[data-hide]'); if(h){ hidden.add(h.dataset.hide); save('or-hidden', [...hidden]); renderCounts(); renderFeed(); return; }
  if(e.target.id === 'unhide'){ e.preventDefault(); hidden = new Set(); save('or-hidden', []); renderCounts(); renderFeed(); return; }
  if(e.target.id === 'calbtn'){ S.view = S.view === 'calendar' ? 'list' : 'calendar'; e.target.classList.toggle('on', S.view === 'calendar'); renderFeed(); return; }
  if(e.target.closest('a')) return;
  const r = e.target.closest('.row'); if(r){ S.open = S.open === r.dataset.id ? null : r.dataset.id; document.querySelectorAll('.row').forEach(x => x.classList.toggle('open', x.dataset.id === S.open)); }
});
$('q').addEventListener('input', e => { S.q = e.target.value; renderFeed(); });
$('cat').addEventListener('change', e => { S.cat = e.target.value; renderFeed(); });
$('grp').addEventListener('change', e => { S.grp = e.target.value; renderFeed(); });
$('sort').addEventListener('change', e => { S.sort = e.target.value; renderFeed(); });
$('theme').addEventListener('click', () => { const cur = document.documentElement.dataset.theme; const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark'; if(next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme; save('or-theme', next); });
(() => { const t = store('or-theme', ''); if(t) document.documentElement.dataset.theme = t; })();

// ── 로드 ──
async function loadJSON(name){
  const bases = location.pathname.includes('/web/') ? ['../data/', 'data/'] : ['data/', '../data/'];
  for(const b of bases){ try { const r = await fetch(b + name, {cache: 'no-store'}); if(r.ok) return await r.json(); } catch(e){} }
  throw new Error(name);
}
(async () => {
  try {
    const [pj, sj] = await Promise.all([loadJSON('programs.json'), loadJSON('sources.json')]);
    D.generated_at = pj.generated_at; D.user = pj.user || {};
    D.programs = (pj.programs || []).filter(p => p.eligibility !== 'no').filter(alive);
    D.sources = sj.sources || [];
    try { D.recurring = (await loadJSON('recurring.json')).items || []; } catch(e){}
  } catch(err){
    $('sync').textContent = '데이터 로드 실패';
    $('groups').innerHTML = `<div class="list"><div class="empty">데이터(${err.message})를 불러오지 못했습니다. 파일을 직접 열면 브라우저가 JSON 읽기를 막습니다 — 프로젝트 폴더에서 <code>python3 -m http.server 8810</code> 실행 후 http://localhost:8810/web/ 로 접속하세요.</div></div>`;
    return;
  }
  $('sync').textContent = '수집 ' + fmtDT(D.generated_at);
  $('foot').textContent = `최근 수집 ${fmtDT(D.generated_at)} · 오늘 ${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')} · 공고 ${D.programs.length}건 · 소스 ${D.sources.length}개`;
  [...new Set(D.programs.map(p => p.category))].sort().forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; $('cat').appendChild(o); });
  renderCounts(); renderFeed();
})();
</script>
</body>
